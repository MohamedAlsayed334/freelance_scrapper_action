# ---------------------------------------------------------------------------
# DISABLED — kept for reference only.
#
# nafezly.com is behind Cloudflare, which answers GitHub-hosted runners with
# HTTP 403 ("Just a moment..."). Requests from Actions never reach the page,
# so every run scraped 0 projects. GitHub's `schedule` event is also
# best-effort (delayed or dropped under load), so it is the wrong scheduler
# for a 10-minute cadence.
#
# The scraper now runs 24/7 on Botkeep. See README.md for the deployment.
#
# The `schedule` trigger is commented out so nothing runs automatically.
# `workflow_dispatch` stays enabled only so the job can be retried manually
# (for example from a self-hosted runner on a non-datacenter IP).
# ---------------------------------------------------------------------------
name: Scrape freelance projects (disabled - Cloudflare blocks runners)

on:
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scraper
  cancel-in-progress: false

jobs:
  scrape:
    # A self-hosted runner would run from your own IP and pass Cloudflare.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One-shot run: the long-running scheduler is for hosts like Botkeep.
      - name: Scrape and send Telegram notifications
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: npm run start:once

      - name: Persist project cache
        run: |
          if [ ! -f cache.json ]; then
            echo "No cache file to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cache.json
          if git diff --cached --quiet; then
            echo "Cache unchanged"
            exit 0
          fi

          git commit -m "chore: update project cache [skip ci]"
          git pull --rebase
          git push
